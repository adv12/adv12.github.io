<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batting Wash Test</title>
<!-- favicon: the same icons shortstorylongarm.com uses (hosted by Wix) -->
<link rel="icon" sizes="192x192" type="image/png" href="https://static.wixstatic.com/media/8eb0f8_6dee7822c6ef4c58bd379e9e3d19a8ba%7Emv2.png/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/8eb0f8_6dee7822c6ef4c58bd379e9e3d19a8ba%7Emv2.png">
<link rel="shortcut icon" type="image/png" href="https://static.wixstatic.com/media/8eb0f8_6dee7822c6ef4c58bd379e9e3d19a8ba%7Emv2.png/v1/fill/w_32%2Ch_32%2Clg_1%2Cusm_0.66_1.00_0.01/8eb0f8_6dee7822c6ef4c58bd379e9e3d19a8ba%7Emv2.png">
<link rel="apple-touch-icon" href="https://static.wixstatic.com/media/8eb0f8_6dee7822c6ef4c58bd379e9e3d19a8ba%7Emv2.png/v1/fill/w_180%2Ch_180%2Clg_1%2Cusm_0.66_1.00_0.01/8eb0f8_6dee7822c6ef4c58bd379e9e3d19a8ba%7Emv2.png">
<style>
:root{
  --page:#2a2724;
  --paper:#fbf8f2;
  --paper-2:#f3eee4;
  --ink:#24211e;
  --ink-2:#55504a;
  --muted:#8a837a;
  --rule:#e3dccf;
  --accent:#1f5a5e;
  --accent-2:#a8484f;
  --accent-soft:#e6efee;
  --cotton:#2a78d6;
  --blend:#eb6834;
  --poly:#1baf7a;
  --special:#4a3aa7;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);font-family:var(--sans);overflow:hidden}
button,select{font:inherit;color:inherit}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{width:1600px;height:900px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;background:var(--paper);padding:64px 84px 70px;display:none;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.35)}
.slide.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* stitched border, a nod to the quilts */
.slide::before{content:"";position:absolute;inset:22px;border:2px dashed var(--rule);border-radius:18px;pointer-events:none}
.slide>*{position:relative}
/* watermark on every slide */
.slide::after{content:"shortstorylongarm.com";position:absolute;left:0;right:0;bottom:33px;text-align:center;
  font:600 16px/1 var(--serif);letter-spacing:.08em;color:var(--ink);opacity:.38;pointer-events:none;z-index:5}
.section-slide::after{color:#fff;opacity:.55}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em;color:var(--ink)}
h2{font-size:52px;line-height:1.08}
h3{font-size:28px}
.kicker{font:600 17px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent-2);margin-bottom:14px}
.lede{font-size:24px;line-height:1.45;color:var(--ink-2);max-width:1150px;margin-top:16px}
p{margin:0}
.foot{position:absolute;left:84px;right:84px;bottom:34px;display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--paper-2);color:var(--ink-2)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.btn{border:1px solid var(--rule);background:#fff;border-radius:10px;padding:8px 16px;font-size:17px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
select.pick{font-size:19px;padding:8px 12px;border-radius:10px;border:1px solid var(--rule);background:#fff;cursor:pointer}

/* ---------- title ---------- */
.title-slide{background:
  radial-gradient(circle at 85% 20%,rgba(168,72,79,.08),transparent 45%),
  radial-gradient(circle at 10% 90%,rgba(31,90,94,.10),transparent 45%),var(--paper)}
.title-slide h1{font-size:92px;line-height:1.02;max-width:900px}
.title-grid{display:grid;grid-template-columns:1fr 620px;gap:40px;height:100%;align-items:center}
.title-mosaic{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;transform:rotate(-3deg)}
.title-mosaic img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);background:#eee}

/* ---------- process ---------- */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-top:40px}
.step{background:#fff;border:1px solid var(--rule);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.step img{width:100%;height:250px;object-fit:cover;object-position:center 30%;background:#eee}
.step .b{padding:14px 16px 18px}
.step .n{font:700 14px var(--sans);color:var(--accent-2);letter-spacing:.1em}
.step h4{font:600 22px/1.2 var(--serif);margin:6px 0 6px}
.step p{font-size:16px;color:var(--ink-2);line-height:1.4}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:26px}
.fact{border-left:4px solid var(--accent);padding:4px 0 4px 16px}
.fact b{display:block;font:600 26px var(--serif)}
.fact span{font-size:16px;color:var(--ink-2)}

/* ---------- lineup ---------- */
.fam-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:34px}
.fam{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:20px}
.fam h3{font-size:24px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.fam h3 .dot{width:16px;height:16px}
.bcard{display:flex;gap:12px;align-items:center;padding:9px 8px;border-radius:12px;cursor:pointer;transition:background .15s}
.bcard:hover{background:var(--paper-2)}
.bcard img{width:58px;height:72px;object-fit:cover;border-radius:6px;background:#eee}
.bcard b{font-size:18px;display:block}
.bcard small{font-size:14px;color:var(--muted)}
.stock{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:4px;padding:2px 6px;margin-left:6px;vertical-align:2px}

/* ---------- paired photos ---------- */
.wipe-wrap{display:grid;grid-template-columns:400px 1fr;gap:44px;margin-top:30px;height:640px}
.side-note{font-size:20px;line-height:1.5;color:var(--ink-2)}
.side-note .big{font:600 34px/1.2 var(--serif);color:var(--ink);margin-bottom:18px}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;height:640px}
.pair figure{margin:0;display:flex;flex-direction:column;gap:8px;cursor:zoom-in;min-height:0}
.pair img{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:14px}
.pair figcaption{font-size:16px;font-weight:600;color:var(--ink-2);text-align:center}
/* ---------- charts ---------- */
.chart-row{display:grid;grid-template-columns:1fr 360px;gap:40px;margin-top:22px}
.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:22px}
.controls label{font-size:16px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
svg text{font-family:var(--sans)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:16px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px;cursor:pointer;padding:3px 8px;border-radius:8px}
.legend span.off{opacity:.35}
.callout{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:22px 24px;font-size:19px;line-height:1.5;color:var(--ink-2)}
.callout b{color:var(--ink)}
.callout h4{font:600 24px var(--serif);margin:0 0 10px;color:var(--ink)}
.callout+.callout{margin-top:16px}
.tip{position:absolute;pointer-events:none;background:#24211e;color:#fff;font-size:15px;line-height:1.45;padding:10px 12px;border-radius:8px;z-index:50;opacity:0;transition:opacity .1s;max-width:300px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tip b{font-size:16px}
.bar-hit{cursor:pointer}
.tablebtn{font-size:15px;color:var(--accent);background:none;border:none;text-decoration:underline;cursor:pointer;padding:0}
.datatable{position:absolute;inset:150px 84px 80px;background:#fff;border:1px solid var(--rule);border-radius:14px;padding:18px 24px;overflow:auto;display:none;z-index:20;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.datatable.show{display:block}
.datatable table{border-collapse:collapse;width:100%;font-size:16px;font-variant-numeric:tabular-nums}
.datatable th,.datatable td{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:right}
.datatable th:first-child,.datatable td:first-child{text-align:left}
.datatable th{color:var(--muted);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.04em}

/* ---------- gallery lineup ---------- */
.lineup{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;margin-top:24px}
.tile{background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden;cursor:zoom-in;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.tile img{width:100%;aspect-ratio:1040/1300;object-fit:cover;display:block;background:#eee}
.tile .cap{padding:7px 9px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;line-height:1.2}
.tile .cap .dot{width:9px;height:9px}
.tile .missing{aspect-ratio:1040/1300;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;color:var(--muted);background:var(--paper-2);padding:10px}

/* ---------- report card ---------- */
table.rc{border-collapse:separate;border-spacing:0;width:100%;margin-top:24px;font-size:17px}
table.rc th{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 12px 10px}
table.rc td{padding:7px 12px;border-top:1px solid var(--rule);vertical-align:middle}
table.rc tr:hover td{background:#fff}
table.rc td:first-child{font-weight:600;cursor:pointer;white-space:nowrap}
.lvl{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.pips{display:inline-flex;gap:3px}
.pips i{width:14px;height:14px;border-radius:3px;background:var(--rule)}
.pips i.f{background:var(--accent)}
.na{color:var(--muted);font-style:italic}
.surf{font-size:15px;color:var(--ink-2)}

/* ---------- batting slide ---------- */
.bat{display:grid;grid-template-columns:1fr 760px;gap:46px;height:100%}
.bat-left{display:flex;flex-direction:column;min-width:0}
.bat h2{font-size:56px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.num{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:14px 16px}
.num b{display:block;font:600 36px/1.1 var(--serif)}
.num span{font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.num small{display:block;font-size:14px;color:var(--ink-2);margin-top:4px}
.notes{margin-top:20px;font-size:19px;line-height:1.5}
.notes dt{font-size:13px;font-weight:700;color:var(--accent-2);letter-spacing:.1em;text-transform:uppercase;margin-top:12px}
.notes dd{margin:3px 0 0;color:var(--ink)}
.mfr{margin-top:auto;font-size:15px;line-height:1.45;color:var(--ink-2);background:var(--paper-2);border-radius:12px;padding:12px 16px}
.mfr b{color:var(--ink)}
.viewer{display:flex;flex-direction:column;height:100%;min-height:0}
.stage-tabs{display:flex;gap:6px;margin-bottom:12px}
.stage-tabs button{flex:1;border:1px solid var(--rule);background:#fff;border-radius:10px;padding:8px 6px;font-size:15px;cursor:pointer;line-height:1.2}
.stage-tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.stage-tabs button:disabled{opacity:.4;cursor:default}
.stage-tabs button small{display:block;font-size:12px;opacity:.75}
.mainimg{flex:1;min-height:0;position:relative;display:flex;justify-content:center;cursor:zoom-in}
.mainimg img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.10)}
.mainimg .missing{position:absolute;inset:0;background:var(--paper-2);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted);text-align:center;padding:40px;cursor:default}
.orig-toggle{position:absolute;right:12px;bottom:12px;font-size:14px;background:rgba(255,255,255,.9);border:1px solid var(--rule);border-radius:8px;padding:6px 10px;cursor:pointer}
.photo-note{position:absolute;left:12px;bottom:12px;font-size:13px;background:rgba(255,255,255,.9);border-radius:8px;padding:6px 10px;color:var(--ink-2)}

/* ---------- compare ---------- */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:20px}
.cmp-col{display:flex;flex-direction:column;gap:12px}
.cmp-img{height:470px;cursor:zoom-in;position:relative;display:flex;justify-content:center}
.cmp-img img{height:100%;width:auto;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.10)}
.cmp-stats{display:flex;gap:22px;font-size:17px;color:var(--ink-2)}
.cmp-stats b{font:600 24px var(--serif);color:var(--ink);display:block}

/* ---------- icebreaker quiz ---------- */
.quiz{display:grid;grid-template-columns:1fr 470px;gap:48px;height:100%}
.quiz h2{font-size:46px;max-width:900px}
.quiz-hint{font-size:20px;color:var(--ink-2);margin-top:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
.opt{display:flex;gap:16px;align-items:flex-start;text-align:left;background:#fff;border:2px solid var(--rule);border-radius:16px;padding:18px 18px;cursor:pointer;position:relative;min-height:128px;transition:border-color .15s,background .15s,opacity .3s}
.opt:hover{border-color:var(--accent)}
.opt .letter{flex:none;width:44px;height:44px;border-radius:50%;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font:600 24px var(--serif);color:var(--accent)}
.opt .otext b{display:block;font:600 26px/1.15 var(--serif)}
.opt .otext small{display:inline-flex;align-items:center;gap:7px;font-size:15px;color:var(--muted);margin-top:5px}
.opt .res{display:none;font-size:17px;line-height:1.4;color:var(--ink-2);margin-top:8px}
.opt .votes{position:absolute;top:12px;right:14px;min-width:36px;height:36px;padding:0 8px;border-radius:18px;background:var(--accent-2);color:#fff;font:700 18px var(--sans);display:flex;align-items:center;justify-content:center}
.opt .votes[hidden]{display:none}
.quiz.revealed .opt .res{display:block}
.quiz.revealed .opt[data-ok="1"]{border-color:var(--accent);background:var(--accent-soft)}
.quiz.revealed .opt[data-ok="1"] .letter{background:var(--accent);color:#fff}
.quiz.revealed .opt[data-ok="0"]{opacity:.6}
.quiz-bar{display:flex;gap:20px;align-items:center;margin-top:22px}
.quiz-bar .btn{font-size:19px;padding:10px 20px;background:var(--accent);border-color:var(--accent);color:#fff}
.quiz-bar kbd{font:600 13px var(--sans);background:rgba(255,255,255,.2);border-radius:4px;padding:1px 6px;margin-left:6px}
.quiz.revealed .quiz-bar .reveal{display:none}
.answer{display:flex;align-items:center;justify-content:center;min-height:0}
.answer .qmark{width:100%;height:100%;max-height:700px;border:3px dashed var(--rule);border-radius:22px;display:flex;align-items:center;justify-content:center;font:600 220px var(--serif);color:var(--rule)}
.answer figure{margin:0;display:flex;flex-direction:column;gap:12px;height:100%;max-height:740px;animation:fade .4s ease}
.answer img{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:14px;cursor:zoom-in}
.answer figcaption{font-size:18px;line-height:1.45;color:var(--ink-2)}
.answer figcaption b{color:var(--ink)}
.answer figcaption span{display:block;margin:6px 0 8px}
.answer .mat{justify-content:center}
.mat-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mat-tile{cursor:zoom-in;text-align:center;font:600 17px var(--serif);color:var(--ink)}
.mat-tile img{width:100%;aspect-ratio:1040/1300;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
.answer .mat figcaption{font-size:20px;margin-top:10px}
.quiz.revealed .qmark{display:none}
.answer figure[hidden]{display:none}

/* ---------- QR slide ---------- */
.qr-wrap{display:grid;grid-template-columns:1fr 640px;gap:60px;align-items:center;height:100%}
.qr-card{background:#fff;padding:44px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.10);width:640px;height:640px}
.qr-card svg{width:100%;height:100%;display:block}
.qr-url{font:600 28px var(--serif);color:var(--accent);margin-top:28px;word-break:break-all}

/* ---------- takeaways ---------- */
.ta{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px}
.ta .card{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:22px 24px}
.ta .card .ic{font-size:34px;line-height:1}
.ta .card h4{font:600 25px var(--serif);margin:10px 0 8px}
.ta .card p{font-size:18px;line-height:1.5;color:var(--ink-2)}
.ta .card .who{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.ta .card .who span{font-size:15px;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:999px;cursor:pointer}

.section-slide{background:var(--accent);color:#fff}
.section-slide::before{border-color:rgba(255,255,255,.25)}
.section-slide h2{color:#fff;font-size:84px}
.section-slide .kicker{color:#f2c7b8}
.section-slide .lede{color:rgba(255,255,255,.85)}
.section-slide .foot{color:rgba(255,255,255,.6)}

ul.fine{font-size:20px;line-height:1.55;color:var(--ink-2);padding-left:24px;margin:24px 0 0;max-width:1300px}
ul.fine li{margin-bottom:10px}
ul.fine b{color:var(--ink)}

/* ---------- chrome: nav, progress, overview, lightbox ---------- */
#progress{position:fixed;left:0;top:0;height:4px;background:var(--accent-2);transition:width .3s;z-index:60}
#nav{position:fixed;right:18px;bottom:16px;display:flex;gap:8px;align-items:center;z-index:60;opacity:.25;transition:opacity .2s}
#nav:hover{opacity:1}
#nav button{background:rgba(255,255,255,.92);border:none;border-radius:10px;width:42px;height:42px;font-size:18px;cursor:pointer}
#nav .count{color:#fff;font-size:14px;min-width:60px;text-align:center}
#help{position:fixed;left:18px;bottom:18px;right:260px;color:rgba(255,255,255,.55);font-size:13px;z-index:59;transition:opacity .4s;pointer-events:none}
#nav button{touch-action:manipulation}
#overview{position:fixed;inset:0;background:rgba(30,28,26,.96);z-index:80;display:none;overflow:auto;padding:40px}
#overview.show{display:block}
#overview .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
#overview .ov{background:var(--paper);border-radius:10px;padding:14px 16px;cursor:pointer;min-height:110px;border:3px solid transparent}
#overview .ov.cur{border-color:var(--accent-2)}
#overview .ov small{color:var(--muted);font-weight:700}
#overview .ov div{font:600 19px/1.25 var(--serif);margin-top:6px}
#overview h3{color:#fff;margin-bottom:20px}
#lightbox{position:fixed;inset:0;background:rgba(20,18,16,.95);z-index:90;display:none;align-items:center;justify-content:center;flex-direction:column}
#lightbox.show{display:flex}
#lightbox img{max-width:92vw;max-height:80vh;object-fit:contain;border-radius:8px;background:#ece7de}
#lightbox .lb-cap{color:#fff;font-size:20px;margin-top:16px;font-family:var(--serif);text-align:center}
#lightbox .lb-cap small{display:block;font-family:var(--sans);font-size:14px;color:rgba(255,255,255,.65);margin-top:4px}
#lightbox .lb-bar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
#lightbox .lb-bar button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 12px;font-size:15px;cursor:pointer}
#lightbox .lb-bar button.on{background:#fff;color:#222}
#lightbox .lb-bar button:disabled{opacity:.3}
#lightbox .x{position:absolute;top:16px;right:22px;background:none;border:none;color:#fff;font-size:38px;cursor:pointer}
@media print{#nav,#help,#progress{display:none}}
</style>
</head>
<body>
<div id="progress"></div>
<div id="viewport"><div id="deck"></div></div>
<div id="nav">
  <button id="ovBtn" title="All slides (G)">▦</button>
  <button id="prevBtn" title="Previous (←)">‹</button>
  <span class="count" id="count"></span>
  <button id="nextBtn" title="Next (→)">›</button>

B.forEach(b=>{
  b.wPct=(b.w0-b.w1)/b.w0*100; b.lPct=(b.l0-b.l1)/b.l0*100;

});
const byId=Object.fromEntries(B.map(b=>[b.id,b]));
const img=(id,s,orig)=>`images/${id}_${s}${orig?"_orig":""}.jpg`;
const hasPhoto=(b,s)=>!(b.missing5&&s===5);
const SHARED_NOTE={ "poly-deluxe_3":"Same photo is filed under Poly Select", "poly-select_3":"Same photo is filed under Poly Deluxe" };
const f1=v=>v.toFixed(1), fIn=v=>{const w=Math.floor(v+1e-9),r=v-w;const fr={0:"",0.25:"¼",0.5:"½",0.75:"¾"}[Math.round(r*4)/4]??"";return (w?w:"")+(fr?fr:(w?"":"0"))+"″"};
const famDot=f=>`<span class="dot" style="background:${FAM[f].color}"></span>`;

/* ======================= SLIDES ======================= */
const slides=[];
const S=(title,html,cls="",init)=>slides.push({title,html,cls,init});
const foot=()=>`<div class="foot"><span>Quilters Dream batting wash test · Fall 2026</span><span class="pg"></span></div>`;

// 1 · Title

  <div>
  <h1>What happens to batting in the wash?</h1>
  <p class="lede" style="font-size:27px">Fourteen Quilters Dream battings, quilted the same way, then creased, steamed, draped, washed and measured.</p>
  <div class="meta" style="margin-top:30px">${Object.values(FAM).map(f=>`<span class="chip"><span class="dot" style="background:${f.color}"></span>${f.label}</span>`).join("")}</div></div>
  <div class="title-mosaic">${["cotton-supreme","angel","wool","blend-7030","puff","poly-select","bamboo","cotton-request"].map((id,i)=>`<img src="${img(id,i%2?5:4)}" alt="">`).join("")}</div>
</div>${foot()}`,"title-slide");

// Icebreaker quiz
S("Icebreaker: test your batting know-how",`<div style="display:flex;flex-direction:column;justify-content:center;height:100%"><div class="kicker">Icebreaker</div><h2>Test your batting know-how</h2>
<p class="lede">First, a quick warm-up about what goes into batting. Then three real projects: which batting would you reach for? Talk it over with your neighbor, vote with a show of hands, and then we’ll reveal the answer.</p></div>${foot()}`,"section-slide");
// options: a batting id, or {label, sub} for non-batting answers; res = reveal text; ok = correct
const QUIZ=[
 {q:"Which of these materials is not used by Quilters Dream in their batting?",
  hint:"Pick one. Click an option to tally hands.", reveal:"Reveal the answer",
  opts:[[{label:"Bamboo",sub:"Plant fiber"},"Used: Dream Bamboo blends bamboo with silk, cotton and Tencel®."],
        [{label:"Hemp",sub:"Plant fiber"},"Not used: there’s no hemp batting in the Quilters Dream lineup.",1],
        [{label:"Flame-retardant fibers",sub:"Specialty fiber"},"Used: Dream Angel is 100% flame-retardant fibers."],
        [{label:"Recycled plastic bottles",sub:"Recycled polyester"},"Used: Dream Green is made from recycled plastic bottles."]],
  tiles:["bamboo","angel","green"],
  answer:`<b>Hemp</b> isn’t part of the Quilters Dream lineup, but the other three are. The battings in this test also include cotton, polyester, cotton/poly blends and wool.`},
 {q:"A wall hanging where you want the custom quilting to really pop",
  opts:[["angel","Did not have quilting definition."],["cotton-request","Did not have much quilting definition."],["puff","Lots of quilting definition, before and after washing.",1],["poly-request","Shrank without crinkle; definition wasn’t noted."]],
  photo:["puff",4], also:"Cotton Deluxe, Cotton Supreme and Dream Wool were strongly defined too."},
 {q:"A quilt with that crinkly, vintage, washed-and-loved look",
  opts:[["poly-deluxe","Shrank, but no cotton-style crinkle."],["angel","Looked much like the poly battings after washing."],["poly-select","No crinkle; a bit baggy in unquilted areas."],["cotton-select","Some crinkle look, especially in the dense quilting.",1]],
  photo:["cotton-select",4], also:"Cotton Deluxe, Cotton Supreme and Dream Puff crinkled too; the 80/20 behaved much like Cotton Select."},
 {q:"A T-shirt quilt with a cozy minky backing",
  reveal:"Reveal our pick",
  opts:[["green","Pretty good drape and only a hint of surface texture after washing. Light enough to keep a heavy quilt cuddly.",1],
        ["cotton-supreme","The heaviest cotton loft, with a stiff drape. Too much weight for an already heavy quilt."],
        ["puff","Lofty and warm, with little drape. Minky is already plenty warm."],
        ["cotton-select","Crinkles after washing, especially where quilting is dense. That look fights smooth T-shirt panels."]],

const optHTML=([o,res,ok],i)=>{const b=typeof o==="string"?byId[o]:null;

const answerHTML=q=>q.tiles
  ? `<figure hidden class="mat"><div class="mat-tiles">${q.tiles.map(id=>`<div class="mat-tile" data-id="${id}"><img src="${img(id,4)}" alt="${byId[id].name}"><span>${byId[id].name}</span></div>`).join("")}</div><figcaption>${q.answer}</figcaption></figure>`

S("How the test worked",`<div class="kicker">The experiment</div><h2>Same quilt, fourteen battings, five checkpoints</h2>

<div class="chart-row"><div data-chart="shrink"></div>
<div><div class="callout"><h4>Everything shrank</h4>Every sample came out smaller — from about <b>4% to 9%</b> in total area. Length shrank more than width on 12 of the 14.</div>
<div class="callout"><h4>Loft matters in cotton</h4>Among the cottons, the heavier the loft, the more it shrank: <b>Supreme</b> (the most of any batting) › Deluxe › Select › Request.</div></div></div>

<p class="lede" style="font-size:21px;margin-top:10px">After washing, the width was measured at the loosely quilted end and at the densely quilted end. The bar shows how much narrower the dense end was.</p>

// generic horizontal bar chart
function hbar(host,rows,{value,fmt,max,tipFn,onClick,unit=""}){
  const W=1060,rowH=40,top=10,left=200,right=70,H=top+rows.length*rowH+34;
  const mx=max??Math.max(...rows.map(value))*1.08; const x=v=>left+(W-left-right)*v/mx;
  const ticks=niceTicks(mx);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">`;
  ticks.forEach(t=>{s+=`<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H-30}" stroke="#e3dccf" stroke-width="1"/><text x="${x(t)}" y="${H-10}" font-size="14" fill="#8a837a" text-anchor="middle">${t}${unit}</text>`;});
  rows.forEach((b,i)=>{const y=top+i*rowH, v=value(b), bw=Math.max(2,x(v)-left);
    s+=`<g class="bar-hit" data-id="${b.id}" data-fam="${b.fam}"><rect x="0" y="${y}" width="${W}" height="${rowH}" fill="transparent"/>
    <text x="${left-14}" y="${y+rowH/2+6}" font-size="17" fill="#24211e" text-anchor="end">${b.name}</text>
    ${bw>8?`<path d="M${left},${y+9} h${bw-4} a4,4 0 0 1 4,4 v${rowH-26} a4,4 0 0 1 -4,4 h-${bw-4} z" fill="${FAM[b.fam].hex}"/>`:`<rect x="${left}" y="${y+9}" width="${bw}" height="${rowH-18}" fill="${FAM[b.fam].hex}"/>`}
    <text x="${left+bw+8}" y="${y+rowH/2+6}" font-size="16" fill="#55504a" font-variant-numeric="tabular-nums">${fmt(v)}</text></g>`;});
  s+=`<line x1="${left}" x2="${left}" y1="${top}" y2="${H-30}" stroke="#c3c2b7"/></svg>`;
  host.innerHTML=s;
  host.querySelectorAll(".bar-hit").forEach(g=>{const b=byId[g.dataset.id];
    g.addEventListener("mousemove",e=>{showTip(e,tipFn(b));host.querySelectorAll(".bar-hit").forEach(o=>o.style.opacity=o===g?1:.45);});
    g.addEventListener("mouseleave",()=>{hideTip();host.querySelectorAll(".bar-hit").forEach(o=>o.style.opacity=1);});
    g.addEventListener("click",()=>{hideTip();document.getElementById("bat-"+b.id)&&go(+document.getElementById("bat-"+b.id).dataset.i);});
  });
}
function niceTicks(mx){const steps=[0.25,0.5,1,2,2.5,5];let st=steps.find(s=>mx/s<=6)||10;const t=[];for(let v=0;v<=mx+1e-9;v+=st)t.push(+v.toFixed(2));return t;}

}

  [0,1,2,3,4,5].forEach(t=>s+=`<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${H-30}" stroke="#e3dccf"/><text x="${x(t)}" y="${H-10}" font-size="14" fill="#8a837a" text-anchor="middle">${t}%</text>`);
  rows.forEach((b,i)=>{const y=top+i*rowH+rowH/2,v=b.avgPct,m=b.mfr.shrink;
    s+=`<g class="bar-hit" data-id="${b.id}" data-fam="${b.fam}"><rect x="0" y="${y-rowH/2}" width="${W}" height="${rowH}" fill="transparent"/>
    <text x="${left-14}" y="${y+6}" font-size="17" fill="#24211e" text-anchor="end">${b.name}</text>`;
    if(m!=null){s+=`<line x1="${x(Math.min(m,v))}" x2="${x(Math.max(m,v))}" y1="${y}" y2="${y}" stroke="#c3c2b7" stroke-width="2"/><rect x="${x(m)-2}" y="${y-11}" width="4" height="22" rx="2" fill="#a8484f"/>`;}
    else s+=`<text x="${x(v)+16}" y="${y+5}" font-size="13" fill="#8a837a">no % stated</text>`;
    s+=`<circle cx="${x(v)}" cy="${y}" r="9" fill="${FAM[b.fam].hex}" stroke="#fbf8f2" stroke-width="2"/></g>`;});
  s+=`</svg>`; host.innerHTML=s;
  host.querySelectorAll(".bar-hit").forEach(g=>{const b=byId[g.dataset.id];
    g.addEventListener("mousemove",e=>showTip(e,batTip(b,`Measured: ${f1(b.avgPct)}% avg (W ${f1(b.wPct)}%, L ${f1(b.lPct)}%)<br>Manufacturer: ${b.mfr.shrinkTxt}`)));
    g.addEventListener("mouseleave",hideTip);
    g.addEventListener("click",()=>{hideTip();go(+document.getElementById("bat-"+b.id).dataset.i);});});
}
function initLD(root){
  const host=root.querySelector('[data-chart="ld"]');
  hbar(host,B.slice().sort((a,b)=>b.ld-a.ld),{value:b=>b.ld,max:1,fmt:v=>v?fIn(v)+" narrower":"even",unit:"″",
    tipFn:b=>batTip(b,`Loose end: ${b.loose}″<br>Dense end: ${b.dense}″`)});
}
function initLineup(root){
  const host=root.querySelector('[data-lineup]');
  const draw=s=>{host.innerHTML=B.map(b=>`<div class="tile" data-id="${b.id}" data-s="${s}">${hasPhoto(b,s)?`<img src="${img(b.id,s)}" alt="${b.name}">`:`<div class="missing">No photo for this step</div>`}<div class="cap">${famDot(b.fam)}${b.name}</div></div>`).join("");};
  host.addEventListener("click",e=>{const t=e.target.closest(".tile");if(t&&hasPhoto(byId[t.dataset.id],+t.dataset.s))openLB(t.dataset.id,+t.dataset.s);});
  root.querySelectorAll("[data-drape-seg] button").forEach(btn=>btn.onclick=()=>{root.querySelectorAll("[data-drape-seg] button").forEach(o=>o.classList.toggle("on",o===btn));draw(+btn.dataset.s);});
  draw(5);
}
function initBat(root){
  const id=root.querySelector("[data-bat]").dataset.bat,b=byId[id];
  const box=root.querySelector(".mainimg"),im=box.querySelector("img"),og=box.querySelector(".orig-toggle");
  let st=1,orig=false;
  const draw=()=>{im.src=img(id,st,orig);im.alt=`${b.name}, ${STAGES[st-1].long}`;og.textContent=orig?"Show edited photo":"Show original photo";
    box.querySelector(".photo-note")?.remove();
    if(SHARED_NOTE[id+"_"+st])box.insertAdjacentHTML("beforeend",`<span class="photo-note">${SHARED_NOTE[id+"_"+st]}</span>`);
    root.querySelectorAll(".stage-tabs button").forEach(x=>x.classList.toggle("on",+x.dataset.st===st));};
  root.querySelectorAll(".stage-tabs button").forEach(x=>x.onclick=()=>{st=+x.dataset.st;draw();});
  og.onclick=e=>{e.stopPropagation();orig=!orig;draw();};
  box.addEventListener("click",()=>{openLB(id,st);lbState.orig=orig;renderLB();});
  // preload this batting's photos
  for(let s=1;s<=5;s++) if(hasPhoto(b,s)) new Image().src=img(id,s);
}
function initQuiz(root){
  const qz=root.querySelector(".quiz"),q=QUIZ[+qz.dataset.quiz];
  qz.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{const v=o.querySelector(".votes");v.hidden=false;v.textContent=+v.textContent+1;});
  qz.querySelector(".reveal").onclick=()=>{qz.classList.add("revealed");qz.querySelector("figure").hidden=false;};
  qz.querySelector(".reset").onclick=()=>{qz.querySelectorAll(".votes").forEach(v=>{v.textContent=0;v.hidden=true;});qz.classList.remove("revealed");qz.querySelector("figure").hidden=true;};
  if(q.photo) qz.querySelector(".ans-img").onclick=()=>openLB(...q.photo);
  qz.querySelectorAll(".mat-tile").forEach(t=>t.onclick=()=>openLB(t.dataset.id,4));
}
function initCompare(root){
  let st=4;
  const cols=[...root.querySelectorAll("[data-cmp-col]")];
  const draw=()=>cols.forEach(c=>{const id=c.querySelector("select").value,b=byId[id];
    const box=c.querySelector(".cmp-img");
    box.innerHTML=hasPhoto(b,st)?`<img src="${img(id,st)}" alt="${b.name}">`:`<div class="missing" style="display:flex;height:100%;align-items:center;justify-content:center;color:var(--muted);font-size:20px">No photo for this step</div>`;
    box.onclick=()=>hasPhoto(b,st)&&openLB(id,st);
    c.querySelector(".cmp-stats").innerHTML=`<div><b>−${f1(b.wPct)}%</b>width</div><div><b>−${f1(b.lPct)}%</b>length</div><div><b>${b.dr==null?"—":["","Stiff","Good","Very drapey"][b.dr]}</b>drape</div><div><b>${b.df==null?"—":["","Little","Some","Strong"][b.df]}</b>definition</div>`;});
  cols.forEach(c=>c.querySelector("select").addEventListener("change",draw));
  root.querySelectorAll("[data-cmp-seg] button").forEach(btn=>btn.onclick=()=>{st=+btn.dataset.s;root.querySelectorAll("[data-cmp-seg] button").forEach(o=>o.classList.toggle("on",o===btn));draw();});
  draw();
}

/* ======================= START ======================= */
const start=parseInt(location.hash.slice(1))||1;
slides[0].el.classList.add("active");
go(start-1,false);
addEventListener("hashchange",()=>{const n=parseInt(location.hash.slice(1));if(n&&n-1!==cur)go(n-1,false);});
</script>
